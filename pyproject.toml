[project]
name = "fava-ai"
version = "0.1.0"
description = "An extensible, local-first AI assistant for Beancount/Fava"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "fava>=1.27",
    "beancount>=2.3",
    "litellm>=1.85",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/v3c70r/fava-ai"
Repository = "https://github.com/v3c70r/fava-ai"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"fava_ai" = "."}
packages = [
    "fava_ai",
    "fava_ai.agent",
    "fava_ai.models",
    "fava_ai.tools",
    "fava_ai.tools.builtin",
    "fava_ai.knowledge",
    "fava_ai.knowledge.extractors",
    "fava_ai.prompts",
    "fava_ai.prompts.builtin",
    "fava_ai.provenance",
    "fava_ai.storage",
]

[tool.setuptools.package-data]
fava_ai = ["templates/*.html", "FavaAI.js"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv", ".sample-ledgers", "docs"]

[tool.ruff.lint]
# Start permissive; tighten in later stages.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length handled by formatter
    "E402",  # module level import not at top (existing pattern in scripts)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811"]
"scripts/**" = ["F401", "F841", "E402"]

[tool.mypy]
python_version = "3.10"
# The package uses a flat layout (repo root == fava_ai), so mypy needs
# explicit package bases to resolve module names correctly.
explicit_package_bases = true
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_configs = true
check_untyped_defs = false
# Silence "annotation-unchecked" notes for annotated locals in untyped functions.
disable_error_code = ["annotation-unchecked"]
no_implicit_optional = true
exclude = ["\\.venv", "\\.sample-ledgers", "^docs/", "^scripts/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
module = "fava.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["arg-type"]
