[project]
name = "fava-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fava>=1.27",
    "beancount>=2.3",
    "litellm>=1.85",
    "pyyaml>=6.0",
    "jinja2>=3.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"fava_ai" = "."}
packages = [
    "fava_ai",
    "fava_ai.agent",
    "fava_ai.models",
    "fava_ai.tools",
    "fava_ai.tools.builtin",
    "fava_ai.knowledge",
    "fava_ai.knowledge.extractors",
    "fava_ai.prompts",
    "fava_ai.prompts.builtin",
    "fava_ai.provenance",
    "fava_ai.storage",
]

[tool.setuptools.package-data]
fava_ai = ["templates/*.html", "FavaAI.js"]
